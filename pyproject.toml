[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "btc5m-paper"
version = "0.1.0"
description = "Public-data-only BTC five-minute paper trading"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "websockets==15.0.1"]

[project.scripts]
btc5m = "btc5m.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.3", "mypy==1.18.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/btc5m"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
